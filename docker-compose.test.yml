services:
  openssh-server:
    image: linuxserver/openssh-server:latest
    container_name: velashell-test-ssh
    hostname: velashell-test-ssh
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=testpass
      - USER_NAME=testuser
      - SUDO_ACCESS=false
      - LOG_STDOUT=true
    ports:
      - "2222:2222"
    volumes:
      - ssh-test-config:/config
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2222 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # 多 shell 靶子:bash / zsh / fish / dash / ash 各一个账号,外加两个"用户已经动过手脚"的账号。
  # 上面那台 linuxserver 的 sshd 以普通用户身份运行,一台只认一个用户,验不了分 shell 的行为。
  # 见 tests/fixtures/ssh-shells/Dockerfile。
  ssh-shells:
    build: ./tests/fixtures/ssh-shells
    image: velashell-test-shells:latest
    container_name: velashell-test-shells
    hostname: velashell-test-shells
    ports:
      - "2223:2222"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2222 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # 两步验证靶子:只开 keyboard-interactive,经 PAM 先问口令再问 TOTP 动态码;
  # 另有一个「钥 + 动态码」的账号。见 tests/fixtures/ssh-2fa/Dockerfile。
  ssh-2fa:
    build: ./tests/fixtures/ssh-2fa
    image: velashell-test-2fa:latest
    container_name: velashell-test-2fa
    hostname: velashell-test-2fa
    ports:
      - "2224:2222"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2222 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # 「老设备」靶子:只剩 diffie-hellman-group14-sha1 / ssh-rsa / hmac-sha1,
  # 默认清单谈不成,要放开老算法才连得上。见 tests/fixtures/ssh-legacy/Dockerfile。
  ssh-legacy:
    build: ./tests/fixtures/ssh-legacy
    image: velashell-test-legacy:latest
    container_name: velashell-test-legacy
    hostname: velashell-test-legacy
    ports:
      - "2225:2222"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2222 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # 面向 FIPS 的后量子混合密钥交换靶子:mlkem768nistp256-sha256 / mlkem1024nistp384-sha384(RFC 10042)。
  # AlmaLinux 10.2 的 OpenSSH 带着 RHEL 的下游补丁,两种都有;清单照开了 FIPS 模式的服务端配(没有 X25519)。
  # 见 tests/fixtures/ssh-pq/Dockerfile。
  ssh-pq:
    build: ./tests/fixtures/ssh-pq
    image: velashell-test-pq:latest
    container_name: velashell-test-pq
    hostname: velashell-test-pq
    ports:
      - "2226:2222"   # FIPS 模式的清单
      - "2227:2223"   # 只给 mlkem1024nistp384-sha384
      - "2228:2224"   # RHEL 10.2 的 DEFAULT 策略(连 X25519 那种也给)
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/2222' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
  # 受控 sudo 靶子:真实 sudo + PAM,带 fish / tcsh 供换登录 shell。用例会 docker exec 进来重写
  # sudoer 的口令、登录 shell 与 sudoers 策略,所以只给测试用。见 tests/fixtures/ssh-sudo/Dockerfile。
  ssh-sudo:
    build: ./tests/fixtures/ssh-sudo
    image: velashell-test-sudo:latest
    container_name: velashell-test-sudo
    hostname: velashell-test-sudo
    ports:
      - "2229:2222"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/2222' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
volumes:
  ssh-test-config:
